packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

allowBuilds:
  core-js: set this to true or false
  esbuild: true
  sharp: true

# Dependencies allowed to run install/build scripts (pnpm blocks them by default).
onlyBuiltDependencies:
  - esbuild
  - sharp

# core-js only prints a donation notice on install; ignore it (never build).
ignoredBuiltDependencies:
  - core-js
